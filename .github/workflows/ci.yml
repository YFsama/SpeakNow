name: CI & Release

# Every push/PR runs checks (typecheck, cargo check, unit tests) on Windows
# and macOS. Publishing is fully automated: when a push to main carries a
# version (src-tauri/tauri.conf.json) that has no GitHub Release yet, each
# platform leg of the publish matrix builds its bundles (Windows NSIS
# installer, macOS aarch64 DMG) and uploads them to the same Release, with
# notes taken from the matching CHANGELOG.md section.
#
# Releasing a version:
#   1. bump `version` in src-tauri/tauri.conf.json and package.json
#   2. add the matching `## vX.Y.Z` section to CHANGELOG.md
#   3. commit and push to main
# Retrying a failed release: Actions -> CI & Release -> Run workflow.
# Re-releasing an existing version: delete its Release and tag first, then Run workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; only the publish job gets write access
permissions:
  contents: read

# Latest run per ref wins: a newer push restarts checks/builds on the newest code
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Version consistency (tauri.conf / package.json / Cargo.toml)
        shell: bash
        run: |
          V1=$(node -p "require('./src-tauri/tauri.conf.json').version")
          V2=$(node -p "require('./package.json').version")
          V3=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          if [ "$V1" != "$V2" ] || [ "$V1" != "$V3" ]; then
            echo "::error::版本不一致 tauri.conf.json=$V1 package.json=$V2 Cargo.toml=$V3"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      # 前后端契约对账：sn-* 事件与 invoke 命令名两侧字符串匹配，编译期
      # 查不了拼写——这里机器兜底（错误级不对称直接红）
      - name: Frontend/backend contract check
        run: npm run contracts

      - name: Rust compile check (incl. examples)
        shell: bash
        run: |
          if cargo check --locked --lib --examples > check.log 2>&1; then
            echo "cargo check passed"
          else
            # 失败时把错误提升为注解：公开仓库的原始日志需登录才能拉取，而
            # check-runs 注解 API 匿名可读。short 格式输出 file:line 单行错误，
            # 便于直接定位；tail 兜底捕捉 panic / OOM 等无 error 行的失败
            strip() { sed 's/\x1b\[[0-9;]*m//g'; }
            { cargo check --locked --lib --message-format=short 2>&1 | strip | grep -E '(^|:) ?error' | head -10 || true
              echo '····· tail ·····'
              tail -6 check.log | strip
            } | while IFS= read -r l; do
              echo "::error::$(printf %s "$l" | cut -c1-500)"
            done
            exit 1
          fi
        working-directory: src-tauri

      - name: Rust unit tests
        run: cargo test --locked
        working-directory: src-tauri

  publish:
    needs: check
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: NSIS installer (.exe)——唯一负责创建 Release 的臂
          # （双臂同时创建会撞车，输家上传失败且重跑时两臂全跳过）
          - os: windows-latest
            args: ""
            asset: "x64-setup.exe"
          # macOS: Apple Silicon (aarch64) .app + .dmg——等 Release 出现后上传
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
            asset: "aarch64.dmg"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check whether this version needs publishing
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ matrix.asset }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="v${VERSION}"
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            # macOS 臂不创建 Release：等 Windows 臂建好（构建最长约半小时）
            if [ "${ASSET}" != "x64-setup.exe" ]; then
              for i in $(seq 1 90); do
                if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
                  break
                fi
                sleep 30
              done
              if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
                echo "::error::等待创建 Release ${TAG} 超时（Windows 臂可能失败）。请重跑本工作流：已存在的产物会跳过，只补缺失平台。"
                exit 1
              fi
            else
              echo "New version ${TAG} detected, building."
            fi
          fi
          # Release 已存在：本平台产物也在才算发布完成——重跑只补缺的那一臂
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' | grep -q "${ASSET}"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} already has ${ASSET}, skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} exists but ${ASSET} missing, building."
          fi

      - name: Extract release notes from CHANGELOG
        id: notes
        if: steps.version.outputs.published == 'false'
        shell: bash
        run: |
          node scripts/extract-changelog.mjs "${{ steps.version.outputs.tag }}" > release-body.md
          # The closing heredoc delimiter must sit on its own line: $(cat) strips
          # trailing newlines and printf adds exactly one back, so this stays
          # correct regardless of the script output.
          {
            printf '## Changes\n\n'
            cat release-body.md
            printf '\n---\nFull changelog: https://github.com/%s/blob/main/CHANGELOG.md\n' "$GITHUB_REPOSITORY"
          } > release-notes.md
          printf 'body<<CHANGELOG_EOF\n%s\nCHANGELOG_EOF\n' "$(cat release-notes.md)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.version.outputs.published == 'false'
        with:
          node-version: 22
          cache: npm

      # aarch64-apple-darwin is only needed on the macOS leg; installing the
      # extra std on Windows is harmless and keeps one shared step.
      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.published == 'false'
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        if: steps.version.outputs.published == 'false'
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        if: steps.version.outputs.published == 'false'
        run: npm ci

      - name: Build and publish GitHub Release
        if: steps.version.outputs.published == 'false'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: SpeakNow ${{ steps.version.outputs.tag }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseCommitish: ${{ github.sha }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
